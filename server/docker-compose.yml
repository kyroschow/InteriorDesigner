# Local MongoDB for the InteriorDesigner backend: a single-node replica set,
# because the backend uses multi-document transactions.
#   npm --prefix server run db:up
services:
  mongo:
    image: mongo:8
    container_name: interior-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - interior-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      # Also initializes the replica set on first start.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

volumes:
  interior-mongo-data:
